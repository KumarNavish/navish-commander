[build]
  command = "node connector/prepare-release.mjs"
  publish = "connector/public"
  functions = "connector/functions"

[functions]
  node_bundler = "esbuild"

[[edge_functions]]
  function = "poll"
  path = "/agent/poll"

[[edge_functions]]
  function = "mcp"
  path = "/mcp"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    X-Frame-Options = "DENY"
