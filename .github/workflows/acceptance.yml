name: release acceptance
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: commander-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  historical-connector-041:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # These source-bound measurements remain on their measured release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: d4f77c5a6a5516404a6522fe0358256420c4db7a
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      # Integrity passing preserves the recorded failed certification gates.
      - run: node scripts/verify-current-connector.mjs evidence/personal-0.4.1-final-inline.json evidence/personal-0.4.1-delivery.json evidence/personal-0.4.1-final-plan.json
      - run: node scripts/verify-chat-documents.mjs
  runtime:
    env:
      NAVISH_CHROMIUM: ${{ matrix.os == 'ubuntu-latest' && '/usr/bin/google-chrome' || '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22.16.0', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: python -m venv .venv && .venv/bin/python -m pip install -r requirements-dev.txt
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
  bundle:
    env:
      NAVISH_CHROMIUM: /usr/bin/google-chrome
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm run bundle
      - run: python3 scripts/verify_release.py --integrity-only dist/*.zip dist/SHA256SUMS.txt
      - run: NAVISH_MCP_SERVER=dist/navish-commander/src/server.mjs npm run test:mcp
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: local-mcp-release-candidate
          path: |
            dist/*.mcpb
            dist/*.zip
            dist/SHA256SUMS.txt
  historical-repository-candidate:
    if: github.event_name == 'workflow_dispatch'
    # The removed model-executor candidate's performance remains source-bound.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: 56320aed0d443c818605f1e86dbe12eef9c6c6b4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: node scripts/verify-current-connector.mjs evidence/personal-0.2.0-inline.json evidence/personal-0.2.0-delivery.json
  historical-response-recovery:
    if: github.event_name == 'workflow_dispatch'
    # Preserve the exact source binding of the 0.1.3 results after adding jobs.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: 321cf94a6dcf608323e73440153215ac217d46b0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: node scripts/verify-workflow-remediation.mjs
      - run: node scripts/verify-current-connector.mjs
      - run: node scripts/test-record-verifiers.mjs
  historical-acceptance:
    if: github.event_name == 'workflow_dispatch'
    # These measured outcomes certify only their original source snapshot.
    # Keep their strict source checks, without applying them to a later repair.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: 631721c88208f611e9a3817337cc21c4f959718f
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: node scripts/verify-personal-connector.mjs
      - run: node scripts/verify-chat-full-access.mjs
      - run: npm run bundle
      - run: python3 scripts/verify_release.py dist/*.zip dist/SHA256SUMS.txt
  historical-chat-efficacy:
    if: github.event_name == 'workflow_dispatch'
    # This conversation record binds to connector 0.1.2, before correlation.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: f0d9d50a4352c6d48a6ac3855d14e64db3e10827
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python3 scripts/chat-efficacy/generate-fixtures.py .bench/reproduced-fixtures
      - run: node scripts/verify-chat-efficacy.mjs evidence/chat-efficacy-extra-high-20260920.json .bench/reproduced-fixtures
  browser-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: CHROMIUM_BIN=/usr/bin/google-chrome python3 runtime/test/runtime/run_browser_tests.py
  ci:
    name: Commander CI
    if: always()
    needs: [runtime, bundle, browser-fixture]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all current-source acceptance checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs = JSON.parse(process.env.RESULTS); if (Object.values(jobs).some(job => job.result !== "success")) process.exit(1);'
